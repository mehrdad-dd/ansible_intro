# ============================================================================
# Ansible Configuration File
# تنظیمات اصلی برای پروژه Role-Based
# ============================================================================

[defaults]
# مسیر فایل موجودی (inventory)
inventory = inventory/production/hosts.yml

# مسیر نقش‌ها (roles)
roles_path = roles

# کاربر راه دور برای SSH
remote_user = ansible

# غیرفعال کردن بررسی host key برای محیط‌های آزمایشی
host_key_checking = False

# فعال کردن پلاگین‌های callback برای نمایش بهتر خروجی
stdout_callback = yaml
callback_whitelist = profile_tasks, timer

# تعداد اتصال‌های همزمان (forks)
forks = 20

# زمان انتظار برای اتصال (ثانیه)
timeout = 30

# فعال کردن pipelining برای افزایش سرعت
pipelining = True

# ذخیره فکت‌ها در کش برای افزایش سرعت
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_cache
fact_caching_timeout = 3600

# مسیر فایل‌های retry
retry_files_enabled = False

# تنظیمات vault
vault_password_file = .vault_pass

[ssh_connection]
# فعال کردن کنترل اتصال SSH
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/tmp/ansible-ssh-%%h-%%p-%%r

[privilege_escalation]
# فعال کردن sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False
