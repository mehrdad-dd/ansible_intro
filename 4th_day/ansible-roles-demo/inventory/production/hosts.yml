---
# ============================================================================
# Inventory File - Production Environment
# موجودی سرورهای محیط تولید
# ============================================================================

all:
  # متغیرهای کلی برای تمام سرورها
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
    organization: "MyCompany"
    environment: production
    
  children:
    # گروه وب سرورها
    webservers:
      hosts:
        web01:
          ansible_host: 192.168.1.10
          server_role: web
          nginx_worker_processes: 4
        web02:
          ansible_host: 192.168.1.11
          server_role: web
          nginx_worker_processes: 4
        web03:
          ansible_host: 192.168.1.12
          server_role: web
          nginx_worker_processes: 2
      vars:
        server_type: webserver
        php_version: "8.1"
        nginx_worker_connections: 1024
    
    # گروه سرورهای دیتابیس
    dbservers:
      hosts:
        db01:
          ansible_host: 192.168.1.20
          server_role: database
          mysql_server_id: 1
          mysql_role: master
        db02:
          ansible_host: 192.168.1.21
          server_role: database
          mysql_server_id: 2
          mysql_role: slave
      vars:
        server_type: database
        mysql_version: "8.0"
        mysql_root_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          62313330656633383939623866313465613434383730333465313966323966373861376265633238
          3032616236653463353961303864363735353064643633350a316539643234373535636463356263
          38663732323632383431383964353734353663653263623963353764383536323437656263666361
          6232323665633934620a653338313739626565313236393034303032376561393234373230366335
          3765
    
    # گروه مانیتورینگ
    monitoring:
      hosts:
        monitor01:
          ansible_host: 192.168.1.30
          server_role: monitoring

# ============================================================================
# نکته: برای رمزنگاری فایل‌های حساس از Ansible Vault استفاده کنید:
# ansible-vault encrypt_string 'your_password' --name 'variable_name'
# ============================================================================
